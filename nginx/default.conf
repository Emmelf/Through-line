server {
    listen 80;
    server_name through-line.online www.through-line.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name through-line.online www.through-line.online;

    ssl_certificate /etc/letsencrypt/live/through-line.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/through-line.online/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
    }
}
