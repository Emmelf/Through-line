name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      CI_JWT_PASSPHRASE: ci_jwt_${{ github.run_id }}_${{ github.run_attempt }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: through_line_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip, sodium
          coverage: none

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create test environment file
        run: |
          cat > .env.test <<EOF
          KERNEL_CLASS='App\Kernel'
          APP_SECRET='test_secret_key_for_testing'
          DATABASE_URL="mysql://root@127.0.0.1:3306/through_line_test?serverVersion=8.0"
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          JWT_PASSPHRASE=ci_jwt_${{ github.run_id }}_${{ github.run_attempt }} # pragma: allowlist secret
          EOF

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot 2>/dev/null; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run database migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Generate JWT keypair for tests
        run: php bin/console lexik:jwt:generate-keypair --env=test --skip-if-exists

      - name: Run PHPUnit
        run: php bin/phpunit tests/Unit tests/Functional --log-junit var/phpunit-junit.xml --no-coverage

  frontend_tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

  e2e_tests:
    runs-on: ubuntu-latest
    needs: [tests, frontend_tests]
    env:
      E2E_JWT_PASSPHRASE: e2e_jwt_${{ github.run_id }}_${{ github.run_attempt }}
      APP_SECRET: e2e_app_secret_${{ github.run_id }}
      JWT_SECRET_KEY: ${{ github.workspace }}/api/config/jwt/private.pem
      JWT_PUBLIC_KEY: ${{ github.workspace }}/api/config/jwt/public.pem

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: through_line_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip, sodium
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install backend dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare backend (migrations + JWT keys)
        working-directory: api
        env:
          APP_ENV: dev
          DATABASE_URL: mysql://root@127.0.0.1:3306/through_line_e2e?serverVersion=8.0
          JWT_PASSPHRASE: ${{ env.E2E_JWT_PASSPHRASE }}
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot 2>/dev/null; do sleep 2; done
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction

      - name: Start Symfony API
        working-directory: api
        env:
          APP_ENV: dev
          DATABASE_URL: mysql://root@127.0.0.1:3306/through_line_e2e?serverVersion=8.0
          JWT_PASSPHRASE: ${{ env.E2E_JWT_PASSPHRASE }}
          CORS_ALLOW_ORIGIN: ^http://localhost:5173$
          COOKIE_SECURE: "0"
        run: |
          nohup php -S 127.0.0.1:8000 -t public > ../api-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000/api/ping && exit 0
            sleep 1
          done
          cat ../api-server.log
          exit 1

      - name: Install frontend dependencies
        working-directory: web-app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web-app
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web-app
        run: npm run test:e2e

      - name: Show API log on failure
        if: failure()
        run: cat api-server.log || true
  deploy:
    runs-on: ubuntu-latest
    needs:
      - tests
      - frontend_tests
      - e2e_tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Build frontend
        working-directory: web-app
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
        run: ssh-keyscan -H "$OVH_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Prepare VPS workspace and env
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          JWT_PASSPHRASE: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: "https://through-line.online/api/auth/google/callback"
          CORS_ALLOW_ORIGIN: "^https://(www\\.)?through-line\\.online$"
          FRONTEND_URL: "https://through-line.online"
        run: |
          {
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$MYSQL_PASSWORD"
            printf 'MYSQL_DATABASE=%s\n' "through_line"
            printf 'MYSQL_USER=%s\n' "through_line_user"
            printf 'MYSQL_PASSWORD=%s\n' "$MYSQL_PASSWORD"
            printf 'APP_SECRET=%s\n' "$APP_SECRET"
            printf 'JWT_PASSPHRASE=%s\n' "$JWT_PASSPHRASE"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'GOOGLE_REDIRECT_URI=%s\n' "$GOOGLE_REDIRECT_URI"
            printf 'CORS_ALLOW_ORIGIN=%s\n' "$CORS_ALLOW_ORIGIN"
            printf 'FRONTEND_URL=%s\n' "$FRONTEND_URL"
          } > .env.prod
          ssh "$OVH_SSH_USER@$OVH_SSH_HOST" "set -e
          if [ ! -d /opt/Through-line/.git ]; then
            rm -rf /opt/Through-line
            git clone https://github.com/Emmelf/Through-line.git /opt/Through-line
          fi
          mkdir -p /opt/Through-line/web-app/dist"
          scp .env.prod "$OVH_SSH_USER@$OVH_SSH_HOST:/opt/Through-line/.env.prod"

      - name: Upload frontend build
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: scp -r web-app/dist/. "$OVH_SSH_USER@$OVH_SSH_HOST:/opt/Through-line/web-app/dist/"

      - name: Deploy on VPS
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: |
          ssh "$OVH_SSH_USER@$OVH_SSH_HOST" "set -e
          cd /opt/Through-line
          git fetch origin
          git checkout main
          git pull origin main
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
          docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T php-fpm php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
          docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T php-fpm php bin/console doctrine:migrations:migrate --no-interaction"
